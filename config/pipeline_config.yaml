# config/pipeline_config.yaml
storage:
  type: "local"  # Set to "local" for your current workspace testing. Switch to "hdfs" later.
  
  local:
    raw_base: "data/raw"
    processed_base: "data/processed"
    
  hdfs:
    namenode: "hdfs://localhost:9000"
    raw_base: "/ecommerce/raw"
    processed_base: "/ecommerce/processed"

analytics:
  weights:
    search: 0.15
    view: 0.20
    cart: 0.30
    purchase: 0.35
  normalization_epsilon: 1.0e-6   # guards min-max normalization division (Memory.md 5.1)
  regional:
    top_n: 10                     # top-N products/categories per location
  mismatch:
    k_scale: 100.0                # ASSUMPTION: weekly unit velocity at demand score 1.0 (Memory.md 5.2)
    sdr_low: 0.5                  # SDR < 0.5  -> HIGH_DEMAND_LOW_STOCK (critical shortage)
    sdr_high: 2.0                 # SDR > 2.0  -> LOW_DEMAND_HIGH_STOCK (excess inventory)
